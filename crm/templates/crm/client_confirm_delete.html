{% extends 'base.html' %}

{% block title %}Clientes{% endblock %}

{% block content %}

<h1>¿Borrar a {{ client.nombre }} {{ client.apellido }}?</h1>

<div class="flex al-center">
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="button button-m primary-button">Confirmar</button>
  </form>
  <a href="{% url 'client_list' %}" class="button button-s secondary-button m-inl-10">&larr; Volver a clientes</a>
</div>

{% endblock %}
