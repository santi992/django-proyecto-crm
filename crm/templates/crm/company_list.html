{% extends 'base.html' %}

{% block title %}Empresas{% endblock %}

{% block content %}

<div class="flex sp-btween al-center">
  <h1>Empresas</h1>
  <a href="{% url 'company_create' %}" class="button button-m primary-button">Nueva empresa</a> 
</div>

<form method="get">
  <input type="text" name="q" value="{{ query }}" placeholder="Nombre o sector">
  <button type="submit">Buscar</button>
</form>
<ul>
  {% for company in companies %}
  <li>
    <a href="{% url 'company_detail' company.pk %}">{{ company.nombre }}</a>
    - {{ company.sector }}
  </li>
  {% empty %}
  <li>No hay empresas cargadas.</li>
  {% endfor %}
</ul>

{% endblock %}
