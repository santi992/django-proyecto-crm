{% extends 'base.html' %}

{% block title %}Interacciones{% endblock %}

{% block content %}

<div class="flex sp-btween al-center">
  <h1>Nueva interacción para {{ client.nombre }}</h1>
  <a href="{% url 'client_detail' client.pk %}">&larr; Volver al cliente</a> 
</div>

<form method="post">
  {% csrf_token %} {{ form.as_p }}
  <button type="submit" class="button button-m primary-button">Guardar</button>
</form>

{% endblock %}
